<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>

<body>  
    <h2>Patient registration form</h2>
    <p>
 Name: <br>
 <input type="text" name="Username" value="" placeholder="Enter your name here" maxlength="30" />
 </p>
 <p>
 Location : 
 <input type="text" name="Location" value="" placeholder="Enter your location here" maxlength="30" />
 </p>
 <p>
 Next of kin: 
 <input type="text" name="next of kin" value="" placeholder="Enter next of kin here" maxlength="30" />
 </p>
 <p>
 Date: 
 <input type="Date" name="" value="" placeholder="Enter your date of birth here" />
 </p>
  <p>
 Please select your Marital status: 
 <br/>⁶⁸
 <input type="radio" name="status" id="" value="married" checked="checked"> married
 <input type="radio" name="status" id="" value="single" > single
 </p>
 <p>
 Weight(kg): 
 <input type="number" name="weight" value="" placeholder="eg. 50kg"/>
 </p>
 <p>
 Id number: 
 <input type="Number" name="Id no." value="" placeholder="Enter you Id" />
 </p>
 <p>
 Address <br>
 <textarea name="comments" id="" cols="" rows="" placeholder="Your address ..."></textarea>
 </p>
 Gender: 
 <br/>
 <input type="radio" name="gender" id="" value="male" checked="checked"> male
 <input type="radio" name="gender" id="" value="female" > female
  <p>
 Health status <br>
 <textarea name="comments" id="" cols="30" rows="7" placeholder=" specify disability if any ..."></textarea>
 </p>
 </body>
